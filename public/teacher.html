<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>うつくしさの境目 — 進行</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="teacher">
    <div class="t-bar">
      <span class="brand" id="brand">うつくしさの境目</span>
      <span class="cls" id="cls"></span>
      <div class="steps" id="steps"></div>
      <button class="btn" id="prev">◀ 戻る</button>
      <button class="btn primary" id="next">次へ ▶</button>
      <button class="btn" id="wait">待機にする</button>
      <span class="spacer"></span>
      <button class="btn" id="view">結果を見せる</button>
      <button class="btn hidden" id="sort">割合順に並べる</button>
      <button class="btn ghost" id="qr">QR</button>
      <button class="btn ghost" id="full">全画面</button>
      <button class="btn ghost" id="reset">リセット</button>
    </div>
    <div class="t-status" id="status"></div>
    <main class="t-main" id="main"></main>

    <div class="overlay hidden" id="login">
      <form class="login" id="loginForm">
        <h1>進行画面</h1>
        <label>クラスコード<input id="loginClass" autocomplete="off" autocapitalize="off" required /></label>
        <label>パスフレーズ<input id="loginKey" type="password" autocomplete="current-password" required /></label>
        <button class="btn primary" type="submit">入る</button>
        <div class="msg" id="loginMsg"></div>
      </form>
    </div>

    <div class="overlay hidden" id="qrOverlay" title="クリックで閉じる"></div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/vendor/qrcode.js"></script>
    <script src="js/teacher.js"></script>
  </body>
</html>
